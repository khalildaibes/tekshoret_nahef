<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תקשורת נחף — מערכת ניהול החנות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=Secular+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231d4ed8'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3E%D7%AA%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- סרגל עליון -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">תn</div>
      <div class="brand-text">
        <strong>תקשורת נחף</strong>
        <span>מערכת ניהול החנות</span>
      </div>
    </div>

    <div class="global-search">
      <svg viewBox="0 0 24 24" class="ico"><path d="M21 21l-4.3-4.3M11 19a8 8 0 100-16 8 8 0 000 16z"/></svg>
      <input id="globalSearch" type="text" placeholder="חיפוש חכם — לדוגמה: iPhone 13 screen ..." autocomplete="off" />
    </div>

    <div class="topbar-actions">
      <a class="phone-chip" href="tel:0535224616">
        <svg viewBox="0 0 24 24" class="ico"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3-8.7A2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/></svg>
        053-522-4616
      </a>
      <button class="btn-ghost" id="backupBtn" title="הורדת גיבוי של כל הנתונים">גיבוי</button>
      <button class="btn-ghost" id="importBtn" title="שחזור נתונים מקובץ גיבוי">שחזור</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
    </div>
  </header>

  <div class="layout">
    <!-- תפריט צד -->
    <aside class="sidebar">
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div class="sf-title">צריך עזרה?</div>
        <a href="tel:0535224616">חייגו 053-522-4616</a>
      </div>
    </aside>

    <!-- אזור תוכן -->
    <main id="main" class="main"></main>
  </div>

  <!-- חלון מודאלי -->
  <div id="modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button class="modal-close" id="modalClose" aria-label="סגירה">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
